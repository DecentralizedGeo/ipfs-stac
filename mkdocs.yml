site_name: ipfs-stac Documentation # Your project name
repo_url: https://github.com/DecentralizedGeo/ipfs-stac

extra:
  social:
    - icon: "fontawesome/brands/github"
      link: "https://github.com/DecentralizedGeo"
    - icon: "fontawesome/brands/twitter"
      link: "https://twitter.com/easierdataorg"

nav: # Navigation links
  - Home: index.md # Home page
  - Reference:
      # - Client Module: client.md # Documentation for client module
      - Client Module:
          - Overview: client.md
          - Asset: asset.md
          - Web3: web3.md
          - Module Functions: functions.md
  - How-to-Guides:
      - Examples: examples.md # Examples
      - Install ipfs-stac: how-to-install.md # Installation guide

theme:
  name: material
  palette:
    # - media: "(prefers-color-scheme)"
    #   toggle:
    #     icon: material/lightbulb-auto
    #     name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      accent: amber
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      accent: amber
      toggle:
        icon: material/lightbulb-outline
        name: Switch to system preference
  user_color_mode_toggle: true
  features:
    - content.code.annotate
    - content.code.copy
    # - content.code.select
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    # - navigation.instant.preview
    - navigation.instant.progress
    - navigation.path
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  highlightjs: true
  hljs_languages:
    - python

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - md_in_html:
  - tables:
  - toc:
  - attr_list:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: false
            docstring_style: google
