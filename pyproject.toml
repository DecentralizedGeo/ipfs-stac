[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "ipfs_stac"
version = "0.2.0"
description = "The EASIER Data Initiative Python IPFS-STAC Client"
authors = [{ name = "The EASIER Data Initiative" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<4" # Specify your python version requirement here
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# [project.urls]
# homepage = "https://www.easierdata.org"
# repository = "https://github.com/DecentralizedGeo/ipfs-stac/"
# documentation = "https://decentralizedgeo.github.io/ipfs-stac/"

dependencies = [
    "ipfsspec (==0.5.2)",
    "fsspec (==2024.9.0)",
    "requests (==2.31.0)",
    "pandas (>=2.0.3)",
    "beautifulsoup4 (==4.12.2)",
    "pystac-client (==0.7.2)",
    "Pillow (==10.0.0)",
    "numpy (>=1.25.0)",
    "rasterio (>=1.3.8)",
    "psutil (==6.0.0)",
    "yaspin (<=3.1.0)",
]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
mypy = "^1.15.0"
ruff = "^0.9.10"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "*"
mkdocs-material = "*"
mkdocstrings = "*"
mkdocstrings-python = "*"

[tool.poetry.group.tests]
optional = true

[tool.poetry.group.tests.dependencies]
pytest = "*"


[tool.black]
line-length = 120

include = '''
(
    \.pyi?$
| ^/tests/
)
'''

exclude = '''
/(
    \.git
  | \.mypy_cache
  | __pycache__
  | __pypackages__
  | \.venv
  | _build
  | build
  | dist
  | .vscode
  | docs
)/
'''

[tool.mypy]
warn_unused_configs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
strict_optional = true
pretty = true
show_column_numbers = true
show_error_context = true

exclude = ['.venv']

[tool.ruff]

# Directories to include in the Ruff check.
exclude = [
    'docs',
    'tests',
    '.venv',
    ".git",
    ".mypy_cache",
    "__pycache__",
    "__pypackages__",
    ".venv",
    "build",
    "dist",
    ".vscode",
]
include = ["*.py", "*.pyi", "**/pyproject.toml", "*.ipynb"]

# Same as Black.
line-length = 120

# A list of rule codes or prefixes to enable
# Vist link to get more info on rules: https://beta.ruff.rs/docs/rules/
lint.select = ["E", "F", "W", "C90"]
lint.ignore = ["E501"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
# Note, if using pre-commit, ensure that ruff is placed before other formatting tool
# hooks as the autofix behavior can output code changes that require reformatting.
fix = true

# Enumerate all fixed violations and the associated violation id.
show-fixes = true
